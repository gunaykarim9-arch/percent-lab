<body>
<a href="#main" class="skip" id="skip"></a>
<header class="topbar"><div class="brand"><div class="logo" aria-hidden="true">%</div><div><strong id="brandName">Faiz Lab</strong><small id="brandSub"></small></div></div><div class="topright"><span class="offline"><i class="dot" aria-hidden="true"></i><span id="offline"></span></span><select id="language" class="language" aria-label="Dil / Language"><option value="az">Azərbaycanca</option><option value="en">English</option></select><button id="full" class="small fullscreen-btn" aria-label="Tam ekran / Full screen">⛶</button><button id="help" class="small" aria-label="Kömək / Help">?</button></div></header>
<div class="app"><aside class="sidebar"><div class="eyebrow" id="navLabel"></div><nav class="nav" id="nav" aria-label="Dərslər / Lessons"></nav><div class="side-note"><strong id="sideTitle"></strong><p id="sideText"></p><div class="progressbar"><span id="progressFill"></span></div><small id="progressText"></small></div><p class="side-foot" id="sideFoot"></p></aside><main id="main" tabindex="-1"></main></div>
<dialog id="helpDialog"><div id="helpContent"></div></dialog>
<noscript><p style="padding:30px">Bu interaktiv dərs üçün brauzerdə JavaScript aktiv olmalıdır. / Please enable JavaScript to use this interactive lesson.</p></noscript>
<script>
'use strict';
// Self-contained teaching app. No external assets, scripts, fonts or analytics.
// All quantities use exact model formulas; decimals are rounded for display only.
const $=id=>document.getElementById(id);
const storeKey='faiz-lab-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch(e){}
let lang=saved.lang==='en'?'en':'az';
let section=0;
let completed=new Set(Array.isArray(saved.completed)?saved.completed.filter(n=>Number.isInteger(n)&&n>=0&&n<8):[]);
const defaults=[{base:200,p:30},{base:200,p:30,mode:'more'},{w:100,yield:80,rise:30,stage:-1},{target:208,step:0},{boys:10,girls:10},{k:1,tableOpen:false}];
const state=defaults.map(o=>({...o}));
let proofOpen=Array(6).fill(false), miniState={},timer=null,playing=false;
let quizIndex=0,quizState={},quizHint=false,round=0;
const t=(az,en)=>lang==='az'?az:en;
const f=(x,max=2)=>{const v=new Intl.NumberFormat('en-GB',{maximumFractionDigits:max,useGrouping:false}).format(Math.abs(x)<1e-9?0:x);return lang==='az'?v.replace('.',','):v;};
const signed=x=>(x>1e-9?'+':x<-1e-9?'−':'')+f(Math.abs(x));
const int=x=>Math.abs(x-Math.round(x))<1e-8;
const clamp=(x,min,max)=>Math.min(max,Math.max(min,x));
const equal=(a,b)=>Math.abs(a-b)<1e-8;
function save(){try{localStorage.setItem(storeKey,JSON.stringify({lang,completed:[...completed]}))}catch(e){}}
const titles=()=>[
 t('Faiz nə deməkdir?','What does percent mean?'),
 t('“Faizi” və “faiz çox” fərqi','“Percent of” or “percent more”?'),
 t('İki addım, iki fərqli əsas','Two steps, two different bases'),
 t('174 · Nəticədən başlanğıca','174 · Work backwards'),
 t('Artan say = azalan say','The gain must equal the loss'),
 t('175 · Niyə 8 yox, 16?','175 · Why 16, not 8?'),
 t('Özünü yoxla','Test yourself'),
 t('Bir səhifədə bütün məntiq','The whole idea on one page')];
const navTitles=()=>[
 t('Faizin mənası','Meaning of percent'),t('İfadəni oxu','Read the wording'),t('Ardıcıl dəyişmə','Successive changes'),t('174 · Geriyə hesabla','174 · Work backwards'),t('Tarazlığı tap','Find the balance'),t('175 · Tam ədəd şərti','175 · Whole numbers'),t('Məşq meydanı','Practice zone'),t('Qısa xülasə','Quick reference')];
const desc=()=>[
 t('100% həmişə seçdiyin bütövdür. Bütövü və faizi dəyiş; rənglənən hissəni və onun miqdarını müqayisə et.','100% always refers to your chosen whole. Change the whole and the percentage; compare the shaded share with its actual amount.'),
 t('Bir söz hesabı dəyişir: 30%-i, 30% çoxu və 30% azı eyni şey deyil. İfadəni seç, nəticəni gör.','One word changes the calculation: 30% of, 30% more and 30% less are different. Choose the wording and watch the result.'),
 t('Buğda → un → çörək. Hər addımda “nəyin faizi?” sualını ver. Faizləri toplamaq əvəzinə əmsalları vur.','Wheat → flour → bread. At each step, ask “percent of what?” Multiply the factors rather than adding the percentages.'),
 t('Çörəyin kütləsi məlumdur. Buğdanı tapmaq üçün əməliyyatları tərs ardıcıllıqla geri aç.','The mass of bread is known. Undo the operations in reverse order to find the wheat.'),
 t('Ümumi say dəyişmirsə, bir qrupa əlavə olunan say digər qrupdan çıxan saya bərabərdir. Faizlərin özləri isə fərqli ola bilər.','When the total is unchanged, the number added to one group equals the number removed from the other. The percentages themselves can differ.'),
 t('Nisbəti tapmaq hələ son addım deyil. Dəyişmədən əvvəl də, sonra da yarım şagird ola bilməz.','Finding the ratio is not the final step. The numbers of students must be whole both before and after the change.'),
 t('Əvvəl proqnoz ver, sonra yoxla. Səhv cavabdan sonra yenidən cəhd edə bilərsən.','Predict first, then check. You can try again after an incorrect answer.'),
 t('Qaydalar, əsas tələlər və hər iki məsələnin yoxlanmış həlli.','The rules, the key traps and checked solutions to both problems.')];
function renderHeader(){
 document.documentElement.lang=lang;
 document.title=t('Faiz Lab · İnteraktiv riyaziyyat','Percent Lab · Interactive mathematics');
 $('language').value=lang;$('brandName').textContent=t('Faiz Lab','Percent Lab');
 $('brandSub').textContent=t('Dəyiş. Müqayisə et. Məntiqi tap.','Change it. Compare it. Make sense of it.');
 $('offline').textContent=t('İnternetsiz işləyir','Works offline');
 $('skip').textContent=t('Dərsə keç','Skip to lesson');
 $('navLabel').textContent=t('İnteraktiv dərslər','Interactive lessons');
 $('sideTitle').textContent=t('Əvvəl gör, sonra hesabla.','See it before you solve it.');
 $('sideText').textContent=t('Sürgünü hərəkət etdir. Cavabı təxmin et. Sonra izahı aç və özünü yoxla.','Move a slider. Predict the result. Then reveal the explanation and test yourself.');
 $('sideFoot').innerHTML=t('174 + 175 üçün əsaslar<br>Faiz · Nisbət · Tam ədəd','Foundations for 174 + 175<br>Percent · Ratio · Whole numbers');
 renderNav();
}
function renderNav(){
 $('nav').innerHTML=navTitles().map((name,i)=>`<button data-nav="${i}" class="${section===i?'active ':''}${completed.has(i)?'done':''}" ${section===i?'aria-current="step"':''}><span class="num">${completed.has(i)?'✓':String(i+1).padStart(2,'0')}</span><span>${name}</span></button>`).join('');
 $('progressFill').style.width=(completed.size/8*100)+'%';
 $('progressText').textContent=t(`${completed.size}/8 bölmə tamamlanıb`,`${completed.size}/8 sections marked complete`);
}
function heading(i){return `<section class="heading"><div><span class="pill">${i<3?t('ƏSASLAR','FOUNDATIONS'):i<6?t('MƏSƏLƏNİ KƏŞF ET','EXPLORE THE PROBLEM'):i===6?t('MƏŞQ','PRACTICE'):t('YADDA SAXLA','TAKEAWAY')}</span><h1>${titles()[i]}</h1><p>${desc()[i]}</p></div><span class="section-count">${String(i+1).padStart(2,'0')} / 08</span></section>`}
function footer(i){return `<div class="lesson-footer"><button data-action="prev" ${i===0?'disabled':''}>← ${t('Əvvəlki','Previous')}</button><button class="primary" data-action="complete">${i===7?t('Tamamladım ✓','Mark complete ✓'):t('Öyrəndim · Növbəti →','Got it · Next →')}</button></div><div class="footer-note">${t('Kəşf et → təxmin et → izah et → məşq et. Cavablar yalnız sənin cihazında yoxlanılır.','Explore → predict → explain → practise. Your answers are checked only on your device.')}</div>`}
function stop(){if(timer)clearInterval(timer);timer=null;playing=false;document.querySelectorAll('[data-action="animate"]').forEach(b=>b.textContent='▶ '+t('Oynat','Animate'))}
function go(i,scroll=true){stop();section=clamp(i,0,7);renderNav();renderMain();if(scroll){window.scrollTo({top:0,behavior:'auto'});const a=document.querySelector('.nav .active');a?.scrollIntoView({block:'nearest',inline:'nearest'});}}
function renderMain(){
 if(section===6){renderQuiz();return}if(section===7){renderSummary();return}
 $('main').innerHTML=heading(section)+`<section class="workspace"><div class="canvas-toolbar"><span>${t('Sürgüləri dəyiş · nəticələr dərhal yenilənir','Move the sliders · results update instantly')}</span><span class="toolbar-tag">${t('Canlı model','Live model')}</span></div><div id="visual" class="visual"></div><div class="controls" id="controls">${controls(section)}</div></section><div id="theory" class="below"></div>${checkpoint(section)}${footer(section)}`;
 update();
}
function slider(key,label,min,max,value,unit='',step=1){return `<div><label class="slider-label" for="s-${key}"><span>${label}</span><output class="value" id="v-${key}" for="s-${key}">${f(value)}${unit}</output></label><input id="s-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" data-key="${key}" data-unit="${unit}" aria-label="${label}"><div class="slider-ends"><span>${min}${unit}</span><span>${max}${unit}</span></div></div>`}
function preset(label,action,extra=''){return `<button class="small" data-action="${action}" ${extra}>${label}</button>`}
function controls(i){const s=state[i];let h='';
 if(i===0){h=`<div class="control-grid">${slider('base',t('Bütöv = 100%','Whole = 100%'),20,400,s.base)}${slider('p',t('Seçilən faiz','Selected percentage'),0,100,s.p,'%')}</div><div class="action-row">${[10,20,25,30,50,75,80,100].map(p=>preset(p+'%','set-percent',`data-p="${p}"`)).join('')}<span class="spacer"></span>${preset('▶ '+t('Oynat','Animate'),'animate')}</div>`;}
 if(i===1){h=`<div class="segmented">${[['of',t('p%-i','p% of')],['more',t('p% çox','p% more')],['less',t('p% az','p% less')]].map(([mode,label])=>`<button data-action="mode" data-mode="${mode}" aria-pressed="${s.mode===mode}">${label}</button>`).join('')}</div><div class="control-grid">${slider('base',t('Başlanğıc miqdar','Original amount'),20,400,s.base)}${slider('p',t('Faiz','Percentage'),0,100,s.p,'%')}</div><div class="action-row">${preset(t('174-dəki 80% un','80% flour in 174'),'yield-example')}${preset(t('174-dəki 30% çox','30% more in 174'),'bread-example')}${preset(t('175-dəki 50% az','50% less in 175'),'class-example')}</div>`;}
 if(i===2){h=`<div class="control-grid">${slider('w',t('Buğda','Wheat'),20,400,s.w,' '+t('kq','kg'))}${slider('yield',t('Buğdadan alınan un','Flour yield from wheat'),50,100,s.yield,'%')}${slider('rise',t('Una nisbətən artıq çörək','Bread increase relative to flour'),0,60,s.rise,'%')}</div><div class="action-row">${preset(t('100 kq ilə bax','Try 100 kg'),'chain100')}${preset(t('174-ün rəqəmləri','Use values from 174'),'chain174')}<span class="spacer"></span>${preset('▶ '+t('Oynat','Animate'),'animate')}</div>`;}
 if(i===3){h=`<div class="control-grid">${slider('target',t('Lazım olan çörək','Target bread'),52,416,s.target,' '+t('kq','kg'),13)}</div><div class="action-row"><button class="primary small" data-action="next-step">${t('Növbəti addımı aç →','Reveal next step →')}</button>${preset(t('208 kq-a qayıt','Back to 208 kg'),'target208')}${preset(t('Addımları gizlət','Hide steps'),'hide-steps')}</div>`;}
 if(i===4){h=`<div class="control-grid">${slider('boys',t('Əvvəlki oğlan sayı · x','Original boys · x'),1,40,s.boys)}${slider('girls',t('Əvvəlki qız sayı · y','Original girls · y'),1,40,s.girls)}</div><div class="action-row">${preset('10 + 10','class-preset','data-b="10" data-g="10"')}${preset('5 + 3','class-preset','data-b="5" data-g="3"')}${preset('10 + 6','class-preset','data-b="10" data-g="6"')}<span class="tiny muted">${t('Faizlər sabitdir: +30% və −50%','Rates are fixed: +30% and −50%')}</span></div>`;}
 if(i===5){h=`<div class="control-grid">${slider('k',t('Nisbətin miqyası · k','Scale of the ratio · k'),1,8,s.k)}</div><div class="action-row">${preset(t('k = 1-i sına','Try k = 1'),'set-k','data-k="1"')}${preset(t('k = 2-ni sına','Try k = 2'),'set-k','data-k="2"')}<span class="spacer"></span>${preset('▶ '+t('Ən kiçiyini axtar','Find the smallest'),'scan')}</div>`;}
 return h;
}
function update(){
 if(section>5)return;
 document.querySelectorAll('input[data-key]').forEach(el=>{const key=el.dataset.key;el.value=state[section][key];$('v-'+key).textContent=f(state[section][key])+(el.dataset.unit||'')});
 document.querySelectorAll('[data-action="mode"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state[1].mode)));
 $('visual').innerHTML=visual(section);$('theory').innerHTML=theory(section);
 const stepBtn=document.querySelector('[data-action="next-step"]');if(stepBtn){stepBtn.disabled=state[3].step>=3;stepBtn.textContent=state[3].step>=3?t('Bütün addımlar açıldı ✓','All steps revealed ✓'):t('Növbəti addımı aç →','Reveal next step →')}
 renderMiniFeedback();
}
function stat(label,val,unit='',cls=''){return `<div class="stat ${cls}"><small>${label}</small><strong>${val}${unit?` <span class="unit">${unit}</span>`:''}</strong></div>`}
const kg=()=>t('kq','kg');
function visual(i){
 const s=state[i];

 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;
 if(action==='prev'){go(section-1);return}
 if(action==='complete'){completed.add(section);save();renderNav();if(section<7)go(section+1);else b.textContent=t('Tamamlandı ✓','Completed ✓');return}
 if(action==='proof'){proofOpen[section]=!proofOpen[section];$('theory').innerHTML=theory(section);return}
 if(action==='grid'||action==='set-percent'){stop();state[0].p=Number(b.dataset.p);update();return}
 if(action==='mode'){state[1].mode=b.dataset.mode;update();return}
 if(action==='yield-example'){state[1]={base:200,p:80,mode:'of'};update();return}
 if(action==='bread-example'){state[1]={base:160,p:30,mode:'more'};update();return}
 if(action==='class-example'){state[1]={base:20,p:50,mode:'less'};update();return}
 if(action==='chain100'||action==='chain174'){stop();state[2]={w:action==='chain100'?100:200,yield:80,rise:30,stage:-1};update();return}
 if(action==='animate'){animate();return}
 if(action==='next-step'){state[3].step=Math.min(3,state[3].step+1);update();return}
 if(action==='target208'){state[3]={target:208,step:0};update();return}
 if(action==='hide-steps'){state[3].step=0;update();return}
 if(action==='class-preset'){state[4]={boys:Number(b.dataset.b),girls:Number(b.dataset.g)};update();return}
 if(action==='set-k'){stop();state[5].k=Number(b.dataset.k);update();return}
 if(action==='scan'){scan();return}
 if(action==='mini'){checkMini(Number(b.dataset.choice));return}
 if(action==='mini-number'){checkMini(null,true);return}
 if(action==='quiz-answer'){checkQuiz(Number(b.dataset.choice));return}
 if(action==='quiz-number'){checkQuiz(null,true);return}
 if(action==='quiz-jump'){quizIndex=Number(b.dataset.q);quizHint=false;renderQuiz();return}
 if(action==='quiz-prev'||action==='quiz-next'){quizIndex+=action==='quiz-prev'?-1:1;quizHint=false;renderQuiz();return}
 if(action==='quiz-hint'){quizHint=!quizHint;renderQuiz();return}
 if(action==='restart-quiz'){if(!Object.keys(quizState).length||confirm(t('Məşq cavabları sıfırlansın? Dərslərdəki irəliləyiş qalacaq.','Reset the practice answers? Your lesson progress will be kept.'))){generated=null;quizIndex=0;quizState={};quizHint=false;renderQuiz()}return}
 if(action==='new-numbers'){if(!Object.keys(quizState).length||confirm(t('Yeni suallara keçilsin? İndiki məşq cavabları sıfırlanacaq.','Start a new question set? Your current practice answers will be reset.')))newNumbers();return}
 if(action==='print'){window.print();return}
 if(action==='close-help'){$('helpDialog').close();return}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='miniInput'){e.preventDefault();checkMini(null,true)}if(e.target.id==='quizInput'){e.preventDefault();checkQuiz(null,true)}});
$('language').addEventListener('change',e=>{stop();lang=e.target.value;miniState={};save();renderHeader();renderMain()});
$('help').addEventListener('click',()=>showHelp());
$('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw new Error('Unsupported')}catch(e){showHelp(t('Bu brauzer burada tam ekran rejiminə icazə vermir. Dərsdən normal pəncərədə istifadə edə bilərsən.','This browser does not allow full screen here. You can still use the lesson in the normal window.'))}});
$('helpDialog').addEventListener('click',e=>{if(e.target===$('helpDialog')){const r=$('helpDialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('helpDialog').close()}});
window.addEventListener('pagehide',stop);
renderHeader();renderMain();
</script>
</body>
</html>
